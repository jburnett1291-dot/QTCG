<script type="module">
  import { DiscordSDK } from "https://esm.sh/@discord/embedded-app-sdk@1.2.0";

  // ---- pool + odds MATCH THE BOT (TVT_ODDS, TVT_PACK_SIZE=3) ----
  const ODDS = [["legendary",0.01],["epic",0.04],["rare",0.15],["uncommon",0.30],["common",0.50]];
  const PACK_SIZE = 3;
  const POOL = {
    legendary: [["Trifecta","3× Champion"],["II WHEEL II","3× Champion"]],
    epic:      [["iBoola","OPOY"],["DynastyOnTop","MVP"]],
    rare:      [["Kyglo","6MOY"],["liLurked","DPOY"]],
    uncommon:  [["Silent Star","All-League"],["Low Ego","All-Def"]],
    common:    [["Role Player","Contributor"],["Bench Unit","Depth"]],
  };

  function drawTier(){ let r=Math.random(),c=0; for(const [t,o] of ODDS){c+=o; if(r<=c)return t;} return "common"; }
  function previewPack(){
    return [
      {tier:'legendary', name:'Trifecta', role:'3x Champ'},
      {tier:'rare',      name:'Kyglo',    role:'6MOY'},
      {tier:'common',    name:'Role Player', role:''},
    ];
  }

  const pack=document.getElementById('pack'), reveal=document.getElementById('reveal'),
        cta=document.getElementById('cta'), again=document.getElementById('again'),
        who=document.getElementById('who'), pfp=document.getElementById('pfp');
  let busy=false;

  // Inside Discord, calls MUST go through the proxy path mapped in the
  // Developer Portal (PREFIX /railway -> your railway domain). In a plain
  // browser we fall back to the direct URL (preview only).
  const IN_DISCORD = location.hostname.endsWith("discordsays.com");
  const PULL_SERVER = IN_DISCORD
    ? "/.proxy/railway"
    : "https://diligent-eagerness-test.up.railway.app";
  
  let authCode = null;
  let sessionToken = null; 
  let discordSdk = null;

  // 1. Authenticate immediately on load
  async function initApp() {
    if (IN_DISCORD) {
        who.innerText = "Authenticating...";
        
        // Ensure you populate your actual VITE_DISCORD_CLIENT_ID or hardcode the string here
        discordSdk = new DiscordSDK(import.meta.env.VITE_DISCORD_CLIENT_ID);
        await discordSdk.ready();
        
        const { code } = await discordSdk.commands.authorize({
          client_id: discordSdk.clientId,
          response_type: "code",
          state: "",
          prompt: "none",
          scope: ["identify", "guilds"]
        });
        authCode = code;

        // Exchange code for session via pull-server API
        try {
          const res = await fetch(`${PULL_SERVER}/api/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code: authCode })
          });
          const data = await res.json();
          if (data.session) {
              sessionToken = data.session;
              who.innerText = data.username || "Player";
              if (data.avatar_url) pfp.src = data.avatar_url;
          } else {
              who.innerText = "Auth Failed";
          }
        } catch (e) {
          console.error("Login exchange failed", e);
          who.innerText = "Guest";
        }
    } else {
        who.innerText = "Browser Preview";
    }
  }

  // 2. Handle Pack Opening
  async function openPack() {
      if (busy) return;
      busy = true;
      
      pack.classList.add("shake");
      cta.innerText = "Connecting to QTCG Servers...";
      
      let pulls = [];
      if (IN_DISCORD && sessionToken) {
          try {
              const res = await fetch(`${PULL_SERVER}/api/pull`, {
                  method: "POST",
                  headers: { 
                      "Content-Type": "application/json",
                      "Authorization": `Bearer ${sessionToken}`
                  }
              });
              const data = await res.json();
              if (data.error) {
                  cta.innerText = `Error: ${data.error}`;
                  pack.classList.remove("shake");
                  busy = false;
                  return;
              }
              pulls = data.cards;
          } catch(e) {
              cta.innerText = "Server Error";
              pack.classList.remove("shake");
              busy = false;
              return;
          }
      } else {
          // Fallback for browser preview
          await new Promise(r => setTimeout(r, 1200)); 
          pulls = previewPack();
      }

      // Animate Burst & Reveal
      pack.classList.remove("shake");
      pack.classList.add("burst");
      
      setTimeout(() => {
          pack.style.display = "none";
          reveal.innerHTML = "";
          
          pulls.forEach((cardData, idx) => {
              const c = document.createElement("div");
              c.className = `card ${cardData.tier}`;
              c.style.animationDelay = `${idx * 0.15}s`;
              
              const t = document.createElement("div");
              t.className = "tier";
              t.innerText = cardData.tier.toUpperCase();
              
              const n = document.createElement("div");
              n.className = "name";
              n.innerText = cardData.name;
              
              const r = document.createElement("div");
              r.className = "role";
              r.innerText = cardData.role || "";
              
              c.appendChild(t);
              c.appendChild(n);
              c.appendChild(r);
              
              if (cardData.tier === "legendary") {
                  const holo = document.createElement("div");
                  holo.className = "holo";
                  c.appendChild(holo);
              }
              
              reveal.appendChild(c);
              setTimeout(() => c.classList.add("in"), 50);
          });
          
          reveal.classList.add("show");
          cta.innerText = "Cards added to your collection!";
          again.classList.add("show");
          busy = false;
      }, 500);
  }

  pack.addEventListener('click', openPack);
  again.addEventListener('click', () => location.reload());

  // Boot the app
  initApp();
</script>
</body>
</html>
