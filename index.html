  <body style="margin:0;background:#060b16;color:#fff;font-family:Inter,Arial,sans-serif">
    <div id="root">
      <main id="qcl-boot-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center">
        <section style="width:min(560px,100%);border:1px solid #24466f;border-radius:18px;background:#0c162c;padding:28px;box-sizing:border-box">
          <div style="color:#f4c95d;font-size:13px;font-weight:800;letter-spacing:.18em">QCL ACTIVITY STATUS</div>
          <h1 style="margin:14px 0 8px;font-size:26px">Starting the War Room…</h1>
          <p id="qcl-boot-message" style="margin:0;color:#9db2ce;line-height:1.6">Loading application files and connecting to Discord.</p>
          <div style="height:5px;margin:22px 0;background:#132743;border-radius:9px;overflow:hidden"><div id="qcl-boot-progress" style="height:100%;width:35%;background:#f4c95d;border-radius:9px"></div></div>
          <pre id="qcl-boot-details" style="display:none;white-space:pre-wrap;text-align:left;max-height:180px;overflow:auto;background:#050914;border:1px solid #24466f;border-radius:10px;padding:12px;color:#c7d6e8;font-size:11px"></pre>
          <div id="qcl-boot-actions" style="display:none;gap:10px;justify-content:center;margin-top:16px">
            <button id="qcl-boot-reload" type="button" style="border:0;border-radius:9px;padding:10px 16px;background:#5865f2;color:white;font-weight:800;cursor:pointer">RELOAD ACTIVITY</button>
            <button id="qcl-boot-copy" type="button" style="border:1px solid #497db4;border-radius:9px;padding:10px 16px;background:#132743;color:white;font-weight:800;cursor:pointer">COPY REPORT</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./boot-monitor.js?v=discord-proxy-1"></script>
    <script type="module" src="./qspn-draft-tools.js?v=discord-proxy-2"></script>
    <script type="module" src="./qspn-test-mode.js?v=discord-proxy-1"></script>
    <script type="module" src="./qspn-broadcast-control.js?v=broadcast-control-1"></script>
  </body>
