<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCL Card Pull</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      user-select:none; }
  html, body { height:100%; }
  body {
    background: radial-gradient(circle at 50% 18%, #1a1f3a, #0d1117 72%);
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; touch-action:manipulation;
  }
  
  /* ---------- TOPBAR ---------- */
  .topbar { position:fixed; top:0; left:0; right:0; padding:12px 16px;
    display:flex; align-items:center; gap:10px; font-size:13px; color:#8b949e;
    background:linear-gradient(#0d1117,transparent); z-index:10; }
  .topbar img { width:26px; height:26px; border-radius:50%; }
  .topbar .who { color:#fff; font-weight:700; }
  .back-btn { background:none; border:none; color:#8b949e; font-size:14px; font-weight:bold; 
    cursor:pointer; display:none; padding-right:10px; }
  .back-btn:active { color:#fff; }

  /* ---------- VIEW SYSTEM ---------- */
  .view { display:none; flex-direction:column; align-items:center; justify-content:center; 
    width:100%; height:100%; padding-top:40px; }
  .view.show { display:flex; }

  /* ---------- HOME MENU ---------- */
  .menu-title { font-size:32px; font-weight:900; letter-spacing:4px; margin-bottom:40px; 
    text-shadow:0 4px 15px rgba(88,101,242,.6); }
  .menu-btn { width:220px; padding:16px; margin:10px; border:none; border-radius:14px;
    background:linear-gradient(135deg,#5865F2,#4752c4); color:#fff; font-weight:800; font-size:16px; 
    cursor:pointer; box-shadow:0 8px 24px rgba(88,101,242,.4); transition:transform .1s; }
  .menu-btn:active { transform:scale(.95); }
  .menu-btn.disabled { background:linear-gradient(135deg,#374151,#1f2937); box-shadow:none; 
    cursor:not-allowed; opacity:.6; }

  /* ---------- BINDER ---------- */
  .binder-title { font-size:24px; font-weight:800; color:#8b949e; margin-bottom:15px; }
  .binder-grid { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; 
    width:100%; max-width:800px; padding:10px 20px 60px 20px; overflow-y:auto; max-height:75vh; }
  
  /* Mini cards for the binder */
  .binder-card {
    width:95px; height:136px; border-radius:10px; position:relative; cursor:default; perspective:800px; 
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-weight:900; box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .binder-card .tier { font-size:8px; letter-spacing:1px; opacity:.9; }
  .binder-card .name { font-size:12px; margin-top:6px; text-align:center; padding:0 6px; }
  .binder-card .badge { position:absolute; top:-6px; right:-6px; background:#ed4245;
    color:#fff; font-size:11px; font-weight:bold; border-radius:12px; padding:2px 6px;
    box-shadow:0 2px 8px rgba(0,0,0,.6); z-index:5; }
  
  /* Webkit scrollbar for binder */
  .binder-grid::-webkit-scrollbar { width:6px; }
  .binder-grid::-webkit-scrollbar-track { background:rgba(0,0,0,.2); border-radius:4px; }
  .binder-grid::-webkit-scrollbar-thumb { background:rgba(88,101,242,.5); border-radius:4px; }

  /* ---------- PACK ---------- */
  .pack {
    width:240px; height:340px; border-radius:22px; cursor:pointer; position:relative;
    background:linear-gradient(135deg,#5865F2 0%,#8b5cf6 45%,#ec4899 100%);
    box-shadow:0 25px 60px rgba(88,101,242,.55), inset 0 2px 20px rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    transition:transform .2s;
  }
  .pack:active { transform:scale(.96); }
  .pack::before { content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    transform:skewX(-20deg); animation:sheen 2.6s infinite; }
  @keyframes sheen { 0%{left:-60%;} 60%,100%{left:160%;} }
  .pack .logo { z-index:2; text-align:center; }
  .pack .logo b { font-size:28px; font-weight:900; letter-spacing:3px;
    text-shadow:0 3px 12px rgba(0,0,0,.5); }
  .pack .logo span { display:block; font-size:11px; letter-spacing:4px; opacity:.85; margin-top:8px; }
  .pack.shake { animation:shake .12s ease-in-out 6; }
  @keyframes shake { 0%,100%{transform:translateX(0) rotate(0);}
    25%{transform:translateX(-6px) rotate(-2deg);} 75%{transform:translateX(6px) rotate(2deg);} }
  .pack.burst { animation:burst .55s ease-out forwards; }
  @keyframes burst { to{transform:scale(1.7);opacity:0;filter:blur(10px);} }

  /* ---------- REVEAL ---------- */
  .reveal { display:none; gap:14px; flex-wrap:wrap; justify-content:center;
    max-width:680px; padding:0 16px; perspective:1000px; }
  .reveal.show { display:flex; }
  .card {
    width:130px; height:186px; border-radius:14px; position:relative; cursor:pointer;
    font-weight:900; opacity:0; transform:translateY(46px) rotateY(90deg);
    box-shadow:0 14px 38px rgba(0,0,0,.55);
    transition:transform .15s ease-out; perspective:900px;
  }
  .card.in { animation:flip .65s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes flip { to{opacity:1;transform:translateY(0) rotateY(0);} }
  .card .tier { font-size:10px; letter-spacing:1.5px; opacity:.9; }
  .card .name { font-size:16px; margin-top:8px; text-align:center; padding:0 8px; }
  .card .role { font-size:10px; opacity:.7; margin-top:4px; }
  
  /* Rarity Colors (shared between binder and pack view) */
  .common, .binder-card.common { background:linear-gradient(135deg,#4b5563,#374151); }
  .uncommon, .binder-card.uncommon { background:linear-gradient(135deg,#16a34a,#15803d); }
  .rare, .binder-card.rare { background:linear-gradient(135deg,#2563eb,#1e40af); }
  .epic, .binder-card.epic { background:linear-gradient(135deg,#7c3aed,#5b21b6); box-shadow:0 0 30px rgba(124,58,237,.55); }
  .legendary, .binder-card.legendary { background:linear-gradient(135deg,#f59e0b,#d97706); box-shadow:0 0 44px rgba(245,158,11,.7); }
  
  .legendary .holo, .binder-card.legendary .holo {
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.7) 45%,
      rgba(88,101,242,.6) 50%,rgba(0,229,255,.6) 55%,transparent 75%);
    background-size:220% 220%; mix-blend-mode:overlay; animation:holo 2.4s linear infinite;
  }
  @keyframes holo { 0%{background-position:0% 0%;} 100%{background-position:220% 220%;} }

  .cta { margin-top:28px; height:22px; color:#8b949e; font-size:14px; }
  .again { margin-top:14px; padding:11px 26px; border:none; border-radius:22px;
    background:#5865F2; color:#fff; font-weight:800; font-size:15px; cursor:pointer;
    display:none; box-shadow:0 8px 24px rgba(88,101,242,.5); }
  .again.show { display:block; }

  /* real card art fills the mini card */
  .binder-card .art { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; border-radius:10px; z-index:1; background:#12151f; }
  .binder-card .art.missing { display:none; }
  .binder-card.has-art .tier, .binder-card.has-art .name { position:relative; z-index:2;
    text-shadow:0 1px 4px rgba(0,0,0,.9); }
  .binder-card.has-art .name { background:rgba(0,0,0,.55); border-radius:0 0 10px 10px;
    width:100%; text-align:center; padding:2px 0; }
  .binder-card.no-art .art { display:none; }

  .face.front .art, .card .art { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; border-radius:14px; z-index:1; background:#12151f; }
  .card .art.missing { display:none; }
  .card.has-art .tier, .card.has-art .name, .card.has-art .role, .face.front .tier, .face.front .name, .face.front .role { position:relative; z-index:2;
    text-shadow:0 1px 5px rgba(0,0,0,.9); }
  .card.has-art .name { background:rgba(0,0,0,.5); border-radius:6px; padding:1px 6px; }
  .card.no-art .art { display:none; }

  /* ---- CARD FLIP (front art / back stats) ---- */
  .card { perspective: 900px; }
  .flip-inner { position:absolute; inset:0; transform-style:preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.3,1.1); }
  .card.flipped .flip-inner { transform: rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:14px; backface-visibility:hidden;
    -webkit-backface-visibility:hidden; display:flex; flex-direction:column;
    align-items:center; justify-content:center; overflow:hidden; }
  .face.back { transform: rotateY(180deg); background:linear-gradient(160deg,#12151f,#1c2233);
    padding:12px 10px; justify-content:flex-start; }
  .back-title { color:#fff; font-size:15px; font-weight:900; margin-top:6px;
    text-align:center; }
  .award { color:#f1c40f; font-size:11px; font-weight:800; margin:4px 0 8px;
    text-align:center; }
  .stat-block { width:100%; display:flex; flex-direction:column; gap:4px; }
  .stat-row { display:flex; justify-content:space-between; padding:2px 8px;
    background:rgba(255,255,255,.05); border-radius:5px; }
  .sl { color:#8b949e; font-size:10px; font-weight:700; text-transform:uppercase; }
  .sv { color:#e6edf3; font-size:11px; font-weight:800; }
  .stat-empty { color:#8b949e; font-size:11px; text-align:center; margin-top:20px; }
  .flip-hint { position:absolute; bottom:6px; left:0; right:0; text-align:center;
    color:rgba(255,255,255,.4); font-size:8px; letter-spacing:.5px; }
  /* front face keeps the art/holo; make sure they live in .front now */
  .face.front { background:linear-gradient(135deg,#232a3d,#12151f); }

  /* ---- BINDER CARD FLIP ---- */
  .binder-card { perspective:800px; }
  .binder-card .flip-inner { position:absolute; inset:0; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.3,1.1); }
  .binder-card.flipped .flip-inner { transform:rotateY(180deg); }
  .binder-card .face { position:absolute; inset:0; border-radius:10px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; }
  .binder-card .face.front { background:linear-gradient(135deg,#232a3d,#12151f); }
  .binder-card .face.back { transform:rotateY(180deg);
    background:linear-gradient(160deg,#12151f,#1c2233); padding:8px 6px;
    justify-content:flex-start; }
  .binder-card .back-title { color:#fff; font-size:11px; font-weight:900;
    text-align:center; margin:4px 0 6px; }
  .binder-card .stat-block { width:100%; display:flex; flex-direction:column; gap:3px; }
  .binder-card .stat-row { display:flex; justify-content:space-between; padding:1px 5px;
    background:rgba(255,255,255,.05); border-radius:4px; }
  .binder-card .sl { color:#8b949e; font-size:8px; font-weight:700; text-transform:uppercase; }
  .binder-card .sv { color:#e6edf3; font-size:9px; font-weight:800; }
  .binder-card .stat-empty { color:#8b949e; font-size:9px; text-align:center; margin-top:16px; }
  .info-btn { position:absolute; top:4px; right:4px; z-index:5; width:18px; height:18px;
    border-radius:50%; border:none; background:rgba(0,0,0,.55); color:#fff;
    font-size:11px; font-weight:900; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center; }
  .info-btn:hover { background:#5865F2; }
  .binder-card .art { z-index:1; }
  .binder-card.has-art .tier, .binder-card.has-art .name { position:relative; z-index:2;
    text-shadow:0 1px 4px rgba(0,0,0,.9); }

  .binder-card .avatar-circle { width:46px; height:46px; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); display:flex; align-items:center;
    justify-content:center; font-size:16px; font-weight:900; color:#fff;
    background:rgba(255,255,255,.08); margin-bottom:6px; z-index:2; }
  .binder-card .arch { color:#8b949e; font-size:7px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px; margin-top:2px; z-index:2; }
  .binder-card .statline { color:#e6edf3; font-size:8px; font-weight:800;
    margin-top:3px; z-index:2; }
</style>
</head>
<body>
  
  <div class="topbar" id="topbar">
    <button class="back-btn" id="btn-back">◀ Back</button>
    <img id="pfp" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
    <span>Opening as <span class="who" id="who">…</span></span>
  </div>

  <!-- HOME VIEW -->
  <div id="view-home" class="view show">
    <div class="menu-title">QTCG</div>
    <button class="menu-btn" id="nav-packs">Open Packs</button>
    <button class="menu-btn" id="nav-binder">My Binder</button>
    <button class="menu-btn disabled" id="nav-play">Play (Coming Soon)</button>
  </div>

  <!-- PACKS VIEW -->
  <div id="view-packs" class="view">
    <div class="pack" id="pack">
      <div class="logo"><b>QCL PACK</b><span>TAP TO OPEN</span></div>
    </div>
    <div class="reveal" id="reveal"></div>
    <div class="cta" id="cta"></div>
    <button class="again" id="again">Open Another</button>
  </div>

  <!-- BINDER VIEW -->
  <div id="view-binder" class="view" style="justify-content: flex-start;">
    <div class="binder-title">Your Collection</div>
    <div id="binder-msg" class="cta" style="margin-top:0;"></div>
    <div id="binder-grid" class="binder-grid"></div>
  </div>

<script type="module">
  // ---- CONSTANTS & SETUP ----
  const IN_DISCORD = location.hostname.endsWith("discordsays.com");
  const PULL_SERVER = IN_DISCORD
    ? "/.proxy/railway"
    : "https://diligent-eagerness-test.up.railway.app";
  let authCode = null;
  let sessionToken = null;

  // ---- VIEW NAVIGATION LOGIC ----
  const views = document.querySelectorAll('.view');
  const btnBack = document.getElementById('btn-back');

  function switchView(viewId) {
    views.forEach(v => v.classList.remove('show'));
    document.getElementById(viewId).classList.add('show');
    
    if (viewId === 'view-home') {
      btnBack.style.display = 'none';
      resetPackUI(); 
    } else {
      btnBack.style.display = 'block';
    }
  }

  function resetPackUI() {
    busy=false; reveal.classList.remove('show'); reveal.innerHTML='';
    again.classList.remove('show'); pack.style.display='flex';
    pack.classList.remove('burst'); cta.textContent='';
  }

  document.getElementById('nav-packs').addEventListener('click', () => switchView('view-packs'));
  
  // Navigate to binder and trigger fetch
  document.getElementById('nav-binder').addEventListener('click', () => {
    switchView('view-binder');
    fetchBinder();
  });
  
  btnBack.addEventListener('click', () => switchView('view-home'));

  // ---- BINDER LOGIC ----
  const binderGrid = document.getElementById('binder-grid');
  const binderMsg = document.getElementById('binder-msg');

  async function fetchBinder() {
    binderGrid.innerHTML = '';
    binderMsg.textContent = 'Loading your collection from SPAM_HUB...';

    if (!sessionToken && !authCode) {
        binderMsg.textContent = 'Authentication required. Wait for login or open a pack first.';
        return;
    }

    try {
        const reqBody = sessionToken ? { session: sessionToken } : { code: authCode };
        const res = await fetch(PULL_SERVER + "/api/binder", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(reqBody)
        });
        const data = await res.json();
        
        if (data.error) {
            binderMsg.textContent = data.error;
            return;
        }

        if (!data.cards || data.cards.length === 0) {
            binderMsg.textContent = "Your binder is empty! Go open some packs.";
            return;
        }

        binderMsg.textContent = `You own ${data.cards.length} unique cards.`;
        
        // Render Cards
        data.cards.forEach(c => {
            const el = document.createElement('div');
            el.className = 'binder-card ' + c.tier + (c.img ? ' has-art' : '');
            let inner = (c.count > 1 ? `<div class="badge">x${c.count}</div>` : '') +
                (c.tier === 'legendary' ? '<div class="holo"></div>' : '');
            if (c.img) {
                // real card art from SPAM_HUB; if it fails to load, fall back to text
                inner += `<img class="art" src="${c.img}" alt="${c.name}" ` +
                         `onerror="this.classList.add('missing');this.parentElement.classList.add('no-art');">`;
            }
            // rich designed front: avatar initials + name + archetype + stat line
            const initials = (c.name||'?').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase() || '?';
            const s0 = c.stats || {};
            const arch = s0.archetype ? `<div class="arch">${s0.archetype}</div>` : '';
            const ppg = (s0.ppg!==undefined && s0.ppg!==null && s0.ppg!=='') ?
                        `<div class="statline">${s0.ppg} PPG</div>` : '';
            if(!c.img){
              inner += `<div class="avatar-circle">${initials}</div>`;
            }
            inner += `<div class="tier">${c.tier.toUpperCase()}</div>` +
                     `<div class="name">${c.name}</div>` +
                     arch + ppg +
                     `<button class="info-btn" title="Stats">i</button>`;
            // BACK face (stats)
            const s = c.stats || {};
            const row = (l,v)=> (v===undefined||v===null||v===''||v===0)?'':
                `<div class="stat-row"><span class="sl">${l}</span><span class="sv">${v}</span></div>`;
            let statRows = row('Arch', s.archetype)+row('GP', s.gp)+row('Legend', s.legend)+
                        row('Perf', s.perf)+row('Long', s.long)+row('Hard', s.hard);
            if(!statRows) statRows = '<div class="stat-empty">No stats yet</div>';
            const back = `<div class="back-title">${c.name}</div>` +
                         `<div class="stat-block">${statRows}</div>` +
                         `<button class="info-btn back-btn" title="Back">×</button>`;
            el.innerHTML = `<div class="flip-inner"><div class="face front">${inner}</div>` +
                           `<div class="face back">${back}</div></div>`;
            el.querySelector('.info-btn').addEventListener('click', (ev)=>{
                ev.stopPropagation(); el.classList.add('flipped'); });
            el.querySelector('.back-btn').addEventListener('click', (ev)=>{
                ev.stopPropagation(); el.classList.remove('flipped'); });
            binderGrid.appendChild(el);
        });
    } catch (err) {
        binderMsg.textContent = 'Failed to connect to the server.';
    }
  }


  // ---- PACK PULL LOGIC ----
  const ODDS = [["legendary",0.01],["epic",0.04],["rare",0.15],["uncommon",0.30],["common",0.50]];
  const PACK_SIZE = 3;

  function previewPack(){
    return [
      {tier:'legendary', name:'Trifecta', role:'3x Champ'},
      {tier:'rare',      name:'Kyglo',    role:'6MOY'},
      {tier:'common',    name:'Role Player', role:''},
    ];
  }

  const pack=document.getElementById('pack'), reveal=document.getElementById('reveal'),
        cta=document.getElementById('cta'), again=document.getElementById('again');
  let busy=false;

  async function open(){
    if(busy) return; busy=true; cta.textContent='';
    pack.classList.add('shake');
    
    const pullPromise = fetch(PULL_SERVER + "/api/openpack", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(sessionToken ? { session: sessionToken }
                                        : { code: authCode })
    }).then(r=>r.json()).catch(()=>null);
    
    setTimeout(()=>{ pack.classList.remove('shake'); pack.classList.add('burst'); },720);
    const result = await pullPromise;
    
    setTimeout(()=>{
      pack.style.display='none';
      if(result && result.cards){
        if(result.session){ sessionToken = result.session; }
        if(result.user){ document.getElementById('who').textContent = result.user; }
        show(result.cards.map(c=>({tier:(c.tier||'Common').toLowerCase(),
                                   name:c.name, role:'', img:c.img})));
      } else if(!authCode){
        cta.textContent = "Preview mode (open inside Discord to save real pulls)";
        show(previewPack());
      } else {
        cta.textContent = (result && result.error)
          ? ("Server: " + result.error)
          : "Couldn't reach the server — check it's awake.";
        busy=false; pack.style.display='flex'; pack.classList.remove('burst');
      }
    },1240);
  }

  function statLine(label, val){
    if(val === undefined || val === null || val === '' || val === 0) return '';
    return `<div class="stat-row"><span class="sl">${label}</span><span class="sv">${val}</span></div>`;
  }
  function cardBack(c){
    const s = c.stats || {};
    let rows =
      statLine('Archetype', s.archetype) +
      statLine('Games', s.gp) +
      statLine('Legend', s.legend) +
      statLine('Perf', s.perf) +
      statLine('Longevity', s.long) +
      statLine('Hardware', s.hard);
    if(!rows) rows = '<div class="stat-empty">Stats coming soon</div>';
    const award = c.role ? `<div class="award">🏆 ${c.role}</div>` : '';
    return `<div class="back-title">${c.name}</div>${award}<div class="stat-block">${rows}</div>`+
           `<div class="flip-hint">tap to flip back</div>`;
  }
  function show(cards){
    reveal.innerHTML=''; reveal.classList.add('show');
    cards.forEach((c,i)=>{
      const el=document.createElement('div');
      el.className='card '+c.tier+(c.img?' has-art':'');
      // front face
      let front=(c.tier==='legendary' ? '<div class="holo"></div>' : '');
      if(c.img){ front+=`<img class="art" src="${c.img}" alt="${c.name}" `+
        `onerror="this.classList.add('missing');this.closest('.card').classList.add('no-art');">`; }
      front+=`<div class="tier">${c.tier.toUpperCase()}</div>`+
        `<div class="name">${c.name}</div>`+
        `<div class="role">${c.role||''}</div>`+
        `<div class="flip-hint">tap for stats</div>`;
      // two-face flip structure
      el.innerHTML=`<div class="flip-inner"><div class="face front">${front}</div>`+
                   `<div class="face back">${cardBack(c)}</div></div>`;
      // click flips (but not during entrance)
      el.addEventListener('click', ()=>{ el.classList.toggle('flipped'); });
      reveal.appendChild(el);
      setTimeout(()=>el.classList.add('in'), 220 + i*280);
    });
    setTimeout(()=>again.classList.add('show'), 220 + cards.length*280 + 500);
  }

  function addTilt(el){
    function m(e){ const r=el.getBoundingClientRect(); const p=e.touches?e.touches[0]:e;
      const x=(p.clientX-r.left)/r.width, y=(p.clientY-r.top)/r.height;
      el.style.transform=`rotateX(${(y-.5)*-20}deg) rotateY(${(x-.5)*20}deg) scale(1.08)`; }
    function r(){ el.style.transform=''; }
    el.addEventListener('mousemove',m); el.addEventListener('mouseleave',r);
    el.addEventListener('touchmove',e=>{e.preventDefault();m(e);},{passive:false});
    el.addEventListener('touchend',r);
  }

  // --- SAFEGUARDS ---
  if (pack) {
    pack.addEventListener('click', open);
  }
  
  if (again) {
    again.addEventListener('click', resetPackUI);
  }

  // ---- Discord Embedded App SDK ----
  try {
    const { DiscordSDK } = await import("https://esm.sh/@discord/embedded-app-sdk@1.2.0");
    const CLIENT_ID = "1498101411894919331";
    const sdk = new DiscordSDK(CLIENT_ID);
    await sdk.ready();
    const { code } = await sdk.commands.authorize({
      client_id: CLIENT_ID, response_type: "code", scope: ["identify"],
    });
    authCode = code;
    
    try {
      const who = document.getElementById('who');
      who.textContent = "logging in…";
      const r = await fetch(PULL_SERVER + "/api/login", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ code: authCode })
      });
      const data = await r.json().catch(()=>null);
      if (data && data.session) {
        sessionToken = data.session;
        who.textContent = data.user || "you";
      } else {
        who.textContent = "you";
      }
    } catch (e) {
      document.getElementById('who').textContent = "you";
    }
  } catch (e) {
    document.getElementById('who').textContent = "you";
  }
</script>
