# Railway/Nixpacks build config — avoids the mise attestation error by using
# nixpacks' own python instead of a pinned runtime.txt version.

[phases.setup]
# Add pip explicitly alongside python and gcc
nixPkgs = ["python312", "python312Packages.pip", "gcc"]

[phases.install]
# Create a virtual environment and install dependencies inside it
# This avoids Python 3.12's strict global install blockage
cmds = [
    "python -m venv /opt/venv",
    "/opt/venv/bin/python -m pip install -r requirements.txt"
]

[start]
# Execute the server using the virtual environment's Python binary
cmd = "/opt/venv/bin/python server.py"
