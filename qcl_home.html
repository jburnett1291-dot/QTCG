<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>QCL · League Command</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #080d19;
      color: #e8edf7;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse at 72% 0, #17253d 0, transparent 45%),
        #080d19;
    }

    .topbar {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 16px;
      border-bottom: 1px solid #273449;
      background: #0a101ef2;
    }

    .brand {
      color: #d9f436;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-decoration: none;
      white-space: nowrap;
    }

    .section {
      color: #aeb9cf;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-left: auto;
    }

    .topbar-actions a {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 11px;
      border: 1px solid #34445b;
      border-radius: 7px;
      color: #e8edf7;
      background: #121b2b;
      font-size: 10px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .topbar-actions a:hover {
      border-color: #d9f436;
      color: #d9f436;
    }

    .topbar-actions .back {
      border-color: #667b2b;
      color: #f0f6d0;
      background: #1a2418;
    }

    main {
      width: 100%;
      height: calc(100% - 48px);
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #080d19;
    }

    @media (max-width: 560px) {
      .topbar {
        min-height: 46px;
        gap: 10px;
        padding: 0 9px;
      }

      .section { display: none; }

      .topbar-actions { gap: 5px; }

      .topbar-actions a {
        min-height: 30px;
        padding: 0 7px;
        font-size: 9px;
      }

      main { height: calc(100% - 46px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/qtcg">• QTCG / QCL</a>
    <span class="section">LEAGUE COMMAND</span>
    <nav class="topbar-actions" aria-label="QCL navigation">
      <a href="/qcl-admin" aria-label="Open season administration">Season Admin</a>
      <a class="back" href="/qtcg">Back to QTCG Activity</a>
    </nav>
  </header>
  <main>
    <iframe
      src="/qcl/"
      title="QCL Streamlit source of truth"
      loading="eager"
    ></iframe>
  </main>
</body>
</html>
